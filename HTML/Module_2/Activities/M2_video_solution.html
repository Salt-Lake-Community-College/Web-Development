<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedding YouTube Videos</title>
  </head>
  <body>
    <!-- Step 1: Go to the YouTube video you want to embed -->
    <!-- Step 2: Click the 'Share' button under the video -->
    <!-- Step 3: Click 'Embed' and copy the provided <iframe> code -->
    <!-- Step 4: Paste the iframe code inside the <body> where you want the video to appear -->

    <h1>My Embedded YouTube Video</h1>

    <!-- Embedded YouTube video using iframe -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/nm5fqM7A9Qo?si=CjaSYe6WbWAZlwWb"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
