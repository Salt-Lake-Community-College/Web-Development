<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Capstone Project</title>
    <!-- Link your external CSS file -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Link your external JS file with defer -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Mini Capstone Project</h1>
      <p>Select one of the projects and customize this template:</p>
    </header>

    <nav>
      <ul>
        <li><button id="todoBtn">To-Do List</button></li>
        <li><button id="currencyBtn">Currency Converter</button></li>
        <li><button id="recipeBtn">Recipe Finder</button></li>
        <li><button id="budgetBtn">Budget Tracker</button></li>
      </ul>
    </nav>

    <main>
      <!-- Section to display project description -->
      <section id="project-description">
        <h2>Project Description</h2>
        <p>Select a project above to see details and start building.</p>
      </section>

      <!-- Main interactive area for the selected project -->
      <section id="project-area">
        <!-- Students will add HTML & JS project-specific UI here -->
      </section>
    </main>

    <footer>
      <p>© 2025 Your Name or School Name</p>
    </footer>
  </body>
</html>
