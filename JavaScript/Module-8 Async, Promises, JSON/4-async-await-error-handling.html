<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Async/Await with Error Handling</title>
  </head>
  <body>
    <h1>Async/Await with Error Handling</h1>
    <button id="startBtn">Start Task</button>
    <div id="output"></div>

    <script>
      // Step 1: This function simulates an API call returning a Promise
      // It either resolves (success) or rejects (failure) after 2 seconds
      function doTask(shouldFail) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (shouldFail) {
              // Step 2a: Simulate failure by rejecting the Promise with an error message
              reject("Task failed!");
            } else {
              // Step 2b: Simulate success by resolving the Promise with a success message
              resolve("Task completed successfully!");
            }
          }, 2000);
        });
      }

      // Step 3: When the button is clicked, start the async function
      document
        .getElementById("startBtn")
        .addEventListener("click", async () => {
          // Step 4: Immediately show that the task has started
          document.getElementById("output").textContent = "Task started...";

          try {
            // Step 5: Await the result of doTask, passing false to simulate success
            // Change to true to simulate failure and trigger the catch block
            const result = await doTask(false);

            // Step 6: If successful, show the success message
            document.getElementById("output").textContent = result;
          } catch (error) {
            // Step 7: If an error occurs (reject), catch it and show the error message
            document.getElementById("output").textContent = error;
          }

          // Step 8: Browser remains responsive throughout this asynchronous process
        });
    </script>
  </body>
</html>
