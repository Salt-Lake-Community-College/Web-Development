<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub User Lookup</title>
    <style>
      #profile {
        margin-top: 1em;
        border: 1px solid #ddd;
        padding: 1em;
        border-radius: 8px;
        max-width: 400px;
      }
      img {
        width: 100px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <input id="username" placeholder="GitHub username" />
    <button id="search">Search</button>
    <div id="profile"></div>

    <script>
      // Step 1: Add a click listener to the "Search" button
      // The function is marked async because we use await inside it
      document.getElementById("search").addEventListener("click", async () => {
        // Step 2: Get the username typed in by the user
        const username = document.getElementById("username").value;
        // Step 3: Get the div where we will show the profile info or errors
        const profileDiv = document.getElementById("profile");

        // Step 4: Show a temporary loading message while waiting for data
        profileDiv.innerHTML = "Loading...";

        // Step 5: Use try...catch to handle errors (like user not found or network errors)
        try {
          /* 
            Step 6: Make an asynchronous API request to GitHub using fetch().
            fetch() returns a Promise that resolves when the response arrives.
            Using await pauses the code here until the Promise resolves,
            without freezing the page.
          */
          const res = await fetch(`https://api.github.com/users/${username}`);

          // Step 7: Check if the HTTP response is OK (status 200-299)
          // If not, throw an error to jump to the catch block
          if (!res.ok) throw new Error("User not found");

          /*
            Step 8: Convert the response body to JSON.
            res.json() also returns a Promise, so we await it.
          */
          const data = await res.json();

          // Step 9: Log data to the console for debugging
          console.log(data);

          // Step 10: Update the page with the user’s info using the JSON data
          profileDiv.innerHTML = `
            <img src="${data.avatar_url}" alt="${data.login}" />
            <h2>${data.name || data.login}</h2>
            <p>${data.bio || "No bio available."}</p>
            <p>${data.location || "No location available."}</p>
          `;
        } catch (err) {
          // Step 11: If any error happens (bad username or network issues),
          // show an error message on the page
          profileDiv.innerHTML = `<p style="color:red;">${err.message}</p>`;
        }
      });
    </script>
  </body>
</html>
