<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fetch API Demo</title>
  </head>
  <body>
    <h1>Users List</h1>
    <div id="users">Loading Random Cat Fact...</div>
    <div id="output"></div>

    <script>
      // Step 1. Define the API URL with this path "https://catfact.ninja/fact"
      var url = "https://catfact.ninja/fact";

      // Step 2. Use Fetch data from the API
      // Use .then() to Convert response to JSON
      // Use .then() a second time to show the data in the console and on the page
      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          console.log(data);
          // Show the cat fact inside the page
          document.getElementById("users").textContent = data.fact;
        })
        //Step 3. Use .catch() to handle any errors with the data retrieval
        .catch((error) => {
          console.error(error);
          document.getElementById("users").textContent =
            "Oops! Something went wrong.";
        });
    </script>
  </body>
</html>
